name: Unit Tests
on:
  workflow_call:
jobs:
  unit-tests:
    name: Core + CLI Tests (${{ matrix.os }}) 🧪
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install libjpeg-turbo for Ubuntu 🛍️
        if: runner.os == 'Linux'
        run: |
          : Install libjpeg-turbo for Ubuntu 🛍️
          sudo apt-get update
          sudo apt-get install -y libturbojpeg0-dev pkg-config

      - name: Install libjpeg-turbo for macOS 🛍️
        if: runner.os == 'macOS'
        run: |
          : Install libjpeg-turbo for macOS 🛍️
          brew install jpeg-turbo pkg-config

      - name: Build + Test Glitch Core 🧱
        run: |
          : Build + Test Glitch Core 🧱
          cmake -S src/glitch -B src/glitch/build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build src/glitch/build --config RelWithDebInfo
          ctest --test-dir src/glitch/build -C RelWithDebInfo --output-on-failure

      - name: Build + Test CLI + Codec 🧱
        run: |
          : Build + Test CLI + Codec 🧱
          cmake -S tools/jpeglitch-cli -B tools/jpeglitch-cli/build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DJPEGLITCH_BUILD_CODEC_TESTS=ON
          cmake --build tools/jpeglitch-cli/build --config RelWithDebInfo
          ctest --test-dir tools/jpeglitch-cli/build -C RelWithDebInfo --output-on-failure
